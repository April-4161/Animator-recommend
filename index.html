<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Animator</title><style>
*{box-sizing:border-box}body{margin:0;background:#080909;color:#f7f7f7;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible{outline:2px solid #fae64e;outline-offset:4px}.app{max-width:480px;margin:auto;background:#111415;min-height:100vh;padding-bottom:85px;overflow:hidden}.status{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:14px;font-weight:600}.status small{font-size:11px;letter-spacing:2px}.header{height:57px;position:relative;display:flex;align-items:center;justify-content:center}.header h1{font-size:27px;font-weight:500;margin:0}.pro{position:absolute;left:13px;background:#fbe64d;color:#151711;border-radius:22px;padding:6px 11px;font-size:16px;font-weight:600}.hero{position:relative;width:100%;aspect-ratio:920/588;overflow:hidden;display:block;padding:0}.hero img{width:100%;height:100%;object-fit:cover}.dots{display:flex;gap:7px;justify-content:center;align-items:center}.hero .dots{position:absolute;bottom:12px;width:100%}.dot{width:7px;height:5px;background:#ffffff55;border-radius:10px;padding:0}.dot.on{width:17px;background:#fff}.features{display:flex;gap:19px;overflow:auto;padding:13px 11px 10px;scrollbar-width:none}.feature{flex:0 0 68px;padding:0;text-align:center;white-space:nowrap;font-size:14px}.tile{width:64px;height:64px;display:grid;place-items:center;background:#282a29;border-radius:17px;margin-bottom:7px;color:#e0e0df}.tile svg{width:43px;height:43px}.feature.active .tile{box-shadow:inset 0 0 0 2px #fbe64d;color:#fbe64d}.featuredots{height:23px;margin-bottom:12px}.section{margin:13px 0 27px}.sectionhead{display:flex;align-items:center;padding:0 15px;gap:6px;margin-bottom:17px}.sectionhead h2{margin:0;font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:-.4px}.more{color:#999;font-size:18px;padding:0;white-space:nowrap}.rail{display:flex;gap:10px;overflow:auto;padding:0 10px;scrollbar-width:none;scroll-snap-type:x mandatory}.card{flex:0 0 137px;aspect-ratio:262/346;padding:0;border-radius:17px;overflow:hidden;position:relative;scroll-snap-align:start;background:#262626}.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.card:hover img{transform:scale(1.04)}.card .caption{position:absolute;bottom:0;left:0;width:100%;padding:28px 3px 8px;background:linear-gradient(transparent,#000b);font-size:19px;line-height:1.08;text-shadow:0 1px 3px #000}.card.original .caption{display:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:69px;background:#0c0e0ff5;display:flex;justify-content:space-around;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{color:#818384;flex:1;font-size:12px;padding:7px 0 5px}.nav svg{width:29px;height:29px;display:block;margin:0 auto 5px}.nav button.selected{color:#fff}.nav button.selected svg{color:#fbe64d}.overlay{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:center;justify-content:center;padding:22px}.overlay.open{display:flex}.modal{width:350px;max-width:100%;background:#202323;border-radius:24px;padding:18px;position:relative}.modal img{width:100%;max-height:50vh;object-fit:cover;border-radius:14px}.close{position:absolute;right:25px;top:25px;background:#0009;border-radius:50%;width:30px;height:30px}.modal h2{margin:15px 0 8px}.modal p{color:#aaa;font-size:14px}.primary{background:#fbe64d;color:#111;width:100%;border-radius:30px;padding:13px;font-weight:700}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fbe64d;color:#111;padding:12px 20px;border-radius:20px;z-index:50;display:none;white-space:nowrap}@media(min-width:600px){.app{box-shadow:0 0 90px #ffffff08}.status{height:45px}}@media(max-width:380px){.sectionhead h2{font-size:21px}.features{gap:14px}.card{flex-basis:130px}}
</style></head><body><div class="app"><div class="status"><span id="clock">11:57</span><small>ᴠᴘɴ ♧ ▰▰  ▰▰  ◉ ▰98</small></div><header class="header"><button class="pro">Get PRO</button><h1>Animator</h1></header><button class="hero" aria-label="Preview featured template"><img src="assets/hero.jpg" alt="Friends dancing together at the seaside"><span class="dots"><i class="dot"></i><i class="dot on"></i><i class="dot"></i></span></button><div class="features" id="features"></div><div class="dots featuredots"><i class="dot on"></i><i class="dot"></i></div><main id="content"></main><nav class="nav" aria-label="Main navigation"></nav></div><div class="overlay" role="dialog" aria-modal="true" aria-label="Template preview"><div class="modal"><button class="close" aria-label="Close">✕</button><img id="preview" alt="Template preview"><h2 id="title"></h2><p id="description">Turn your photo into a fun, animated moment.</p><button class="primary" id="use">Try this template</button><input type="file" id="upload" accept="image/*" hidden></div></div><div class="toast" role="status"></div><script>
const paths={duo:'M8 18a4 4 0 1 0 0-8 4 4 0 0 0 0 8m16 0a4 4 0 1 0 0-8 4 4 0 0 0 0 8M7 23l-5 10h8v9m4-20 6 11v9m9-20-6 10v10m-7-7v7',spark:'m23 5 6 11 11 7-11 6-6 12-7-12-11-6 11-7Zm15 29 4 5-4 5-4-5Z',shirt:'m14 7 9 3 9-3 9 8-6 6-4-4v24H13V17l-4 4-6-6 11-8Zm1 1q8 15 16 0',partner:'M15 25a8 8 0 1 0 0-16 8 8 0 0 0 0 16m19 0a8 8 0 1 0 0-16 8 8 0 0 0 0 16M7 42q0-13 9-13t9 13m0 0q0-13 9-13t9 13M12 18l3 2 3-2m13 0 3 2 3-2',scene:'M33 39H9a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5h27a5 5 0 0 1 5 5v20M11 18l7-8m0 17 10-13m-3 19 10-13m-3 15h12l-3-4m3 9H32l3 4',home:'m5 22 18-16 18 16v17a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6Zm12 16q6 4 12 0',video:'M31 5H10a5 5 0 0 0-5 5v29a5 5 0 0 0 5 5h27a5 5 0 0 0 5-5V18M18 16l13 9-13 9ZM40 5h1',planet:'M35 10C6-1 5 42 26 40S49 10 35 10ZM3 35Q-1 20 43 15q10 12-40 20',me:'M23 44a20 20 0 1 0 0-40 20 20 0 0 0 0 40m-9-14q9 9 18 0'};
const icon=n=>`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.spark}"/></svg>`;
const cats=[['Duo','duo'],['AI FX','spark'],['Outfit','shirt'],['AI Partner','partner'],['Scene','scene'],['Sticker','video']];document.querySelector('#features').innerHTML=cats.map(([n,i])=>`<button class="feature" data-name="${n}"><span class="tile">${icon(i)}</span>${n}</button>`).join('');
const groups=[{title:'Try Everyone’s Favorite😆',items:[['Seaside Cheers','seaside',true],['Family Paws Dance','family',true],['Baby Dance','baby',true],['Weekend Groove','hero',false]]},{title:'Chant Your Halloween Incantati…',items:[['Little Monsters','halloween'],['Midnight Magic','witch'],['Vampire Dance','vampire'],['Spooky Party','halloween']]},{title:'Make Your Photo Move✨',items:[['Baby Dance','baby',true],['Seaside Cheers','seaside',true],['Family Paws Dance','family',true]]}];
function render(){document.querySelector('#content').innerHTML=groups.map((g,j)=>`<section class="section"><div class="sectionhead"><h2>${g.title}</h2><button class="more" data-more="${j}">More ›</button></div><div class="rail">${g.items.map(([n,a,o])=>`<button class="card ${o?'original':''}" data-title="${n}" data-asset="${a}" aria-label="Preview ${n}"><img src="assets/${a}.jpg" alt="${n}" loading="lazy"><span class="caption">${n}</span></button>`).join('')}</div></section>`).join('')}render();
const navs=[['Home','home'],['AI Video','video'],['Tools','spark'],['Moment','planet'],['Me','me']];document.querySelector('.nav').innerHTML=navs.map(([n,i],j)=>`<button class="${j===0?'selected':''}" data-tab="${n}">${icon(i)}${n}</button>`).join('');
const overlay=document.querySelector('.overlay');function preview(n,a){document.querySelector('#preview').src=`assets/${a}.jpg`;document.querySelector('#title').textContent=n;document.querySelector('#description').textContent='Turn your photo into a fun, animated moment.';document.querySelector('#use').textContent='Try this template';overlay.classList.add('open')}function close(){overlay.classList.remove('open')}let timer;function toast(s){const t=document.querySelector('.toast');t.textContent=s;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2500)}
document.addEventListener('click',e=>{const card=e.target.closest('.card');if(card)preview(card.dataset.title,card.dataset.asset);const more=e.target.closest('[data-more]');if(more){const r=more.closest('section').querySelector('.rail');r.scrollBy({left:280,behavior:'smooth'})}const f=e.target.closest('.feature');if(f){document.querySelectorAll('.feature').forEach(x=>x.classList.remove('active'));f.classList.add('active');preview(f.dataset.name+' · Explore templates',f.dataset.name==='Duo'?'family':'witch')}const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('selected'));tab.classList.add('selected');if(tab.dataset.tab==='Home'){window.scrollTo({top:0,behavior:'smooth'})}else if(tab.dataset.tab==='AI Video'){document.querySelector('#upload').click()}else{toast(tab.dataset.tab+' · Preview page')}}});document.querySelector('.hero').onclick=()=>preview('Seaside Cheers','hero');document.querySelector('.close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelector('#use').onclick=()=>document.querySelector('#upload').click();document.querySelector('#upload').onchange=e=>{if(e.target.files[0]){close();toast('Photo selected · Frontend demo')}};document.querySelector('.pro').onclick=()=>{preview('Animator PRO','witch');document.querySelector('#description').textContent='Unlock more creative possibilities. This is a frontend preview.';document.querySelector('#use').textContent='Explore templates';document.querySelector('#use').onclick=close};
</script><script src="bold-picks.js"></script><script src="quiet-picks.js"></script></body></html>
